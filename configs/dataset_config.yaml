# LyraAI Dataset Downloader Configuration
# This file controls how the dataset is acquired from Apple Music.

# --- Project Details ---
PROJECT_NAME: "LyraAI"

# --- Directory Paths ---
# Base path for all raw downloaded data.
RAW_DATA_BASE_PATH: "data/raw"
# Subdirectories for specific data types.
RAW_AUDIO_DIR: "data/raw/audio"
RAW_LYRICS_DIR: "data/raw/lyrics"
RAW_META_DIR: "data/raw/meta"
# Base path for temporary files created during download.
TEMP_PATH_BASE: "data/raw/temp"

# --- Apple Music API Settings ---
# Path to your Netscape format cookies.txt file.
# This is required for authentication with the Apple Music API.
COOKIES_PATH: "cookies.txt"

# --- Download Strategy ---
# 'playlists': Downloads all songs from the URLs specified below.
# 'genres': Searches for playlists by genre and downloads a target number of songs.
DOWNLOAD_MODE: 'playlists'

# --- Lyrics Format ---
# The format for downloaded synced lyrics. We need TTML for word-level ground truth.
# Options: LRC, ENHANCED_LRC, SRT, TTML
LYRICS_FORMAT: "TTML"

