# configs/train_config.yaml
# Modified for the LyraAI Project

# --- Model & Training Run Identifier ---
# Changed from the default to our new project name.
model_name: "LyraAI"

# --- Performance & Reproducibility ---
float32_matmul_precision: "high"
random_seed: 1234

# --- Dataloader Configuration ---
dataloader_workers: 16 # Adjust based on your CPU cores

# Our dataset from `prepare_sofa_data.py` only contains 'full_label' data.
# The order is [no_label, weak_label, full_label].
# We set weights for others to 0 so the sampler only uses our high-quality data.
oversampling_weights: [0, 0, 1]

# Max total length of audio (in seconds) per batch.
# Adjust this based on your GPU memory. 600 is a good starting point.
batch_max_length: 600
binning_length: 1000
drop_last: true

# --- Trainer Configuration ---
accelerator: "gpu"
devices: 1 # Set to the number of GPUs you want to use
precision: "16-mixed" # Use mixed precision for faster training and less memory usage
gradient_clip_val: 1.0
gradient_clip_algorithm: "norm"
val_check_interval: 1000 # Validate every 1000 training steps
check_val_every_n_epoch: null

# --- Model Architecture ---
# Using the default SOFA model architecture which is well-suited for this task.
model:
  hidden_dims: 256
  down_sampling_factor: 2
  down_sampling_times: 5
  channels_scaleup_factor: 2

# --- Optimizer & Scheduler Configuration ---
optimizer_config:
  # Total training steps. This is a key parameter to tune.
  # 200k is a solid starting point for a large dataset.
  total_steps: 200000
  lr:
    backbone: 0.001
    head: 0.001
  weight_decay: 0.01
  freeze:
    backbone: false
    head: false

# --- Loss Function Configuration ---
# Using the default SOFA loss weights and functions.
# These are well-tuned for the task of forced alignment.
loss_config:
  function:
    num_bins: 10
    alpha: 0.5
    label_smoothing: 0.05
    pseudo_label_ratio: 0.3
  losses:
    weights:
      - 1.0 # ph_frame_GHM_loss
      - 1.0 # ph_edge_GHM_loss
      - 1.0 # ph_edge_EMD_loss
      - 1.0 # ph_edge_diff_loss
      - 1.0 # ctc_GHM_loss
      - 1.0 # consistency_loss
      - 1.0 # pseudo_label_loss
    enable_RampUpScheduler:
      - false
      - false
      - false
      - false
      - false
      - true
      - true